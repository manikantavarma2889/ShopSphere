services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: shopsphere-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: shopsphere-notification-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  notification-service:
    build: ./notification-service
    container_name: shopsphere-notification-service
    command: ["bundle", "exec", "puma", "-C", "config/puma.rb"]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      REDIS_URL: redis://redis:6379/0
      NOTIFICATION_SERVICE_TOKEN: ${NOTIFICATION_SERVICE_TOKEN:-local-shopsphere-notification-token}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-local-only-secret-key-change-before-production}
    ports:
      - "3000:3000"
    restart: unless-stopped

  notification-worker:
    build: ./notification-service
    container_name: shopsphere-sidekiq-worker
    command: ["bundle", "exec", "sidekiq", "-r", "./config/environment.rb", "-q", "order_notifications"]
    depends_on:
      redis:
        condition: service_healthy
      notification-service:
        condition: service_started
    environment:
      RAILS_ENV: production
      REDIS_URL: redis://redis:6379/0
      NOTIFICATION_SERVICE_TOKEN: ${NOTIFICATION_SERVICE_TOKEN:-local-shopsphere-notification-token}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-local-only-secret-key-change-before-production}
    restart: unless-stopped

  eureka-server:
    build: ./service-discovery
    container_name: service-discovery
    ports:
      - "8761:8761"
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: shopsphere
      POSTGRES_USER: shopsphere
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  auth-service:
    build: ./auth-service
    container_name: auth-service
    depends_on:
      - postgres
      - eureka-server
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopsphere
      SPRING_DATASOURCE_USERNAME: shopsphere
      SPRING_DATASOURCE_PASSWORD: secret
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      JWT_SECRET: shopsphere-jwt-secret-key-minimum-256-bits-long
    ports:
      - "8081:8081"
    restart: unless-stopped

  product-service:
    build: ./product-service
    container_name: product-service
    depends_on:
      - postgres
      - eureka-server
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopsphere
      SPRING_DATASOURCE_USERNAME: shopsphere
      SPRING_DATASOURCE_PASSWORD: secret
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    ports:
      - "8082:8082"
    restart: unless-stopped

  order-service:
    build: ./order-service
    container_name: order-service
    depends_on:
      - postgres
      - eureka-server
      - rabbitmq
      - notification-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopsphere
      SPRING_DATASOURCE_USERNAME: shopsphere
      SPRING_DATASOURCE_PASSWORD: secret
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      NOTIFICATION_SERVICE_URL: http://notification-service:3000
      NOTIFICATION_SERVICE_TOKEN: ${NOTIFICATION_SERVICE_TOKEN:-local-shopsphere-notification-token}
    ports:
      - "8083:8083"
    restart: unless-stopped

  payment-service:
    build: ./payment-service
    container_name: payment-service
    depends_on:
      - postgres
      - eureka-server
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopsphere
      SPRING_DATASOURCE_USERNAME: shopsphere
      SPRING_DATASOURCE_PASSWORD: secret
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    ports:
      - "8084:8084"
    restart: unless-stopped

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    depends_on:
      - eureka-server
      - auth-service
      - product-service
      - order-service
      - payment-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
