version: '3.8'

services:
  # Service Discovery (Eureka Server)
  eureka-server:
    build: ./service-discovery
    container_name: service-discovery
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: shopsphere
      POSTGRES_USER: shopsphere
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Auth Service
  auth-service:
    build: ./auth-service
    container_name: auth-service
    depends_on:
      - postgres
      - eureka-server
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/shopsphere
      - SPRING_DATASOURCE_USERNAME=shopsphere
      - SPRING_DATASOURCE_PASSWORD=secret
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://localhost:8761/eureka
    ports:
      - "8081:8081"
    restart: unless-stopped

  # Product Service
  product-service:
    build: ./product-service
    container_name: product-service
    depends_on:
      - postgres
      - eureka-server
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/shopsphere
      - SPRING_DATASOURCE_USERNAME=shopsphere
      - SPRING_DATASOURCE_PASSWORD=secret
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://localhost:8761/eureka
    ports:
      - "8082:8082"
    restart: unless-stopped

  # Order Service
  order-service:
    build: ./order-service
    container_name: order-service
    depends_on:
      - postgres
      - eureka-server
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/shopsphere
      - SPRING_DATASOURCE_USERNAME=shopsphere
      - SPRING_DATASOURCE_PASSWORD=secret
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://localhost:8761/eureka
    ports:
      - "8083:8083"
    restart: unless-stopped

  # Payment Service
  payment-service:
    build: ./payment-service
    container_name: payment-service
    depends_on:
      - postgres
      - eureka-server
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/shopsphere
      - SPRING_DATASOURCE_USERNAME=shopsphere
      - SPRING_DATASOURCE_PASSWORD=secret
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://localhost:8761/eureka
    ports:
      - "8084:8084"
    restart: unless-stopped

  # API Gateway
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    depends_on:
      - eureka-server
      - auth-service
      - product-service
      - order-service
      - payment-service
    environment:
      - SPRING_CLOUD_GATEWAY_ROUTES defaultZone=http://localhost:8761/eureka
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data: