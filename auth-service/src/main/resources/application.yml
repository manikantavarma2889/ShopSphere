# Corrected auth-service application.yml
server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/shopsphere
    username: shopsphere
    password: secret
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: auth_schema
  flyway:
    enabled: true
    schemas: auth_schema
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
  config:
    import: optional:file:src/main/resources/application-dev.yml

cloud:
  aws:
    s3:
      enabled: false
    credentials:
      enabled: false
    region:
      auto: false

eureka:
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show: always

jwt:
  secret: shopsphere-jwt-secret-key-minimum-256-bits-long
  expiration: 86400000
  refresh-token-expiration: 604800000

logging:
  level:
    root: INFO
    com.shopsphere: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

# dev profile overrides (optional)
---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/shopsphere_dev
    username: shopsphere
    password: secret
  flyway:
    enabled: true
    schemas: auth_schema_dev
    baseline-on-migrate: true