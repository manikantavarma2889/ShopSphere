server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shopsphere}
    username: ${SPRING_DATASOURCE_USERNAME:shopsphere}
    password: ${SPRING_DATASOURCE_PASSWORD:secret}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: auth_schema
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: auth_schema
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

cloud:
  aws:
    s3:
      enabled: false
    credentials:
      enabled: false
    region:
      auto: false

eureka:
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show: always

jwt:
  secret: ${JWT_SECRET:shopsphere-jwt-secret-key-minimum-256-bits-long}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

logging:
  level:
    root: INFO
    com.shopsphere: INFO
    org.springframework.security: INFO
