server:
  port: 8083

spring:
  application:
    name: order-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shopsphere}
    username: ${SPRING_DATASOURCE_USERNAME:shopsphere}
    password: ${SPRING_DATASOURCE_PASSWORD:secret}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: order_schema
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: order_schema
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    connection-timeout: 5s

shopsphere:
  notifications:
    exchange: shopsphere.notifications
    routing-key: order.confirmation
    order-confirmation-queue: shopsphere.order-confirmation
    service-url: ${NOTIFICATION_SERVICE_URL:http://localhost:3000}
    service-token: ${NOTIFICATION_SERVICE_TOKEN:local-shopsphere-notification-token}

eureka:
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show: always

logging:
  level:
    root: INFO
    com.shopsphere: INFO
    org.hibernate.SQL: DEBUG
