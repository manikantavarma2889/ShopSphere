name: Frontend CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Run Type Check
        working-directory: frontend
        run: |
          npx tsc --noEmit

      - name: Run Lint
        working-directory: frontend
        run: |
          npm run lint

      - name: Run Tests
        working-directory: frontend
        run: |
          npm test

      - name: Build
        working-directory: frontend
        run: |
          npm run build